<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <defs>
    <!-- Body Pearlescent White-Lavender Gradient -->
    <radialGradient id="bodyGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </radialGradient>
    <linearGradient id="bodyShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <!-- Golden Horn Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Rainbow Mane Gradients (Pink, Yellow, Turquoise) -->
    <linearGradient id="manePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="maneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="maneCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Hooves Gradient -->
    <linearGradient id="hoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- Starry Eye Iris Gradient -->
    <radialGradient id="eyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
    <!-- Soft Magical Glow -->
    <filter id="magicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c084fc" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Twinkling 4-Point Stars Around Unicorn -->
  <g fill="#fef08a">
    <path d="M48 62 L53 78 L69 83 L53 88 L48 104 L43 88 L27 83 L43 78 Z" opacity="0.95"/>
    <path d="M312 48 L316 60 L328 64 L316 68 L312 80 L308 68 L296 64 L308 60 Z" fill="#bae6fd" opacity="0.9"/>
    <path d="M328 148 L331 157 L340 160 L331 163 L328 172 L325 163 L316 160 L325 157 Z" opacity="0.85"/>
    <path d="M34 210 L37 218 L45 221 L37 224 L34 232 L31 224 L23 221 L31 218 Z" fill="#f5d0fe" opacity="0.85"/>
    <circle cx="82" cy="40" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="275" cy="95" r="3.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="62" cy="155" r="2.5" fill="#7dd3fc" opacity="0.85"/>
  </g>

  <g filter="url(#magicGlow)">
    <!-- RAINBOW TAIL (Flowing Turquoise, Yellow, Pink Locks) -->
    <g>
      <path d="M248 196 C295 168, 336 202, 326 254 C320 278, 334 288, 340 282 C318 302, 294 282, 298 250 C300 222, 275 205, 248 208 Z" fill="url(#maneCyan)" stroke="#1e1b4b" stroke-width="2.5"/>
      <path d="M246 202 C288 182, 322 218, 312 272 C308 295, 322 304, 330 296 C306 316, 282 296, 285 262 C288 232, 268 214, 244 214 Z" fill="url(#maneGold)" stroke="#1e1b4b" stroke-width="2.5"/>
      <path d="M242 208 C278 196, 305 232, 296 286 C292 310, 308 320, 316 310 C290 332, 265 308, 270 272 C274 244, 258 224, 240 220 Z" fill="url(#manePink)" stroke="#1e1b4b" stroke-width="2.5"/>
    </g>

    <!-- BACK LEGS -->
    <!-- Far Back Leg -->
    <path d="M188 242 C184 268, 174 292, 168 312 L196 312 C200 292, 208 268, 212 244 Z" fill="url(#bodyShadow)" stroke="#4c1d95" stroke-width="2.5"/>
    <path d="M164 310 C164 302, 198 302, 198 310 L200 324 C188 327, 172 327, 162 324 Z" fill="url(#hoofGrad)" stroke="#2e1065" stroke-width="2.5"/>

    <!-- Raised Front Leg (Playful Pose!) -->
    <path d="M116 226 C88 228, 76 250, 86 274 L108 268 C102 254, 110 244, 128 242 Z" fill="url(#bodyShadow)" stroke="#4c1d95" stroke-width="2.5"/>
    <path d="M84 272 C92 266, 110 268, 110 276 L102 292 C92 292, 82 284, 84 272 Z" fill="url(#hoofGrad)" stroke="#2e1065" stroke-width="2.5"/>

    <!-- UNICORN TORSO & NECK -->
    <path d="M118 176 C112 212, 116 244, 146 254 C178 264, 218 256, 236 250 C258 242, 266 212, 252 192 C238 174, 198 178, 176 180 C166 154, 162 126, 152 108 L112 124 C118 144, 120 160, 118 176 Z" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="2.8"/>

    <!-- Near Front Standing Leg -->
    <path d="M134 236 C136 266, 134 294, 130 318 L160 318 C160 294, 162 266, 166 240" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="2.8"/>
    <path d="M126 315 C128 306, 162 306, 162 315 L164 330 C150 333, 136 333, 124 330 Z" fill="url(#hoofGrad)" stroke="#2e1065" stroke-width="2.5"/>

    <!-- Near Back Standing Leg -->
    <path d="M214 232 C222 262, 228 292, 226 318 L256 318 C256 290, 252 258, 248 226" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="2.8"/>
    <path d="M222 315 C224 306, 258 306, 258 315 L260 330 C246 333, 232 333, 220 330 Z" fill="url(#hoofGrad)" stroke="#2e1065" stroke-width="2.5"/>

    <!-- BACK MANE CURLS (Behind Neck) -->
    <path d="M158 84 C198 76, 222 108, 206 142 C226 148, 232 174, 212 192 C192 206, 168 192, 168 168 Z" fill="url(#maneCyan)" stroke="#1e1b4b" stroke-width="2.5"/>
    <path d="M152 96 C188 94, 208 124, 194 158 C210 168, 212 192, 192 206 C174 216, 156 198, 158 174 Z" fill="url(#maneGold)" stroke="#1e1b4b" stroke-width="2.5"/>
    <path d="M144 114 C174 116, 190 144, 178 176 C190 188, 188 208, 170 218 C154 224, 142 206, 146 184 Z" fill="url(#manePink)" stroke="#1e1b4b" stroke-width="2.5"/>

    <!-- UNICORN HEAD & CUTE SNOUT -->
    <path d="M118 82 C92 86, 76 108, 78 132 C62 142, 54 158, 58 174 C62 190, 82 198, 102 192 C108 200, 122 202, 132 192 C148 184, 164 166, 166 142 C168 112, 148 80, 118 82 Z" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="2.8"/>

    <!-- Cute Smile & Nostril & Rosy Cheek -->
    <path d="M74 162 C70 158, 74 152, 79 155 C82 157, 80 163, 76 162" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M84 184 C94 190, 108 188, 114 178 C110 192, 96 198, 86 190 Z" fill="#ec4899" stroke="#831843" stroke-width="2"/>
    <ellipse cx="128" cy="168" rx="10" ry="6" fill="#f472b6" opacity="0.45"/>

    <!-- BIG EXPRESSIVE STARRY EYE -->
    <g>
      <!-- Eyelashes -->
      <path d="M98 124 L90 115 M108 118 L104 107 M120 117 L122 106 M131 122 L139 113 M136 132 L146 127" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Eye White & Iris -->
      <ellipse cx="115" cy="138" rx="19" ry="21" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <ellipse cx="113" cy="139" rx="14.5" ry="16.5" fill="url(#eyeIris)"/>
      <circle cx="112" cy="139" r="8" fill="#090b24"/>
      <!-- Star Highlight inside Eye -->
      <path d="M108 127 L110 133 L116 135 L110 137 L108 143 L106 137 L100 135 L106 133 Z" fill="#ffffff"/>
      <circle cx="120" cy="147" r="3.5" fill="#ffffff"/>
      <circle cx="105" cy="148" r="2" fill="#bae6fd"/>
    </g>

    <!-- FOREHEAD RAINBOW CURLS -->
    <path d="M108 78 C86 68, 62 84, 66 106 C52 106, 48 122, 64 130 C82 136, 108 120, 118 98 Z" fill="url(#maneCyan)" stroke="#1e1b4b" stroke-width="2.5"/>
    <path d="M124 72 C104 54, 78 66, 82 88 C98 98, 122 96, 134 82 Z" fill="url(#maneGold)" stroke="#1e1b4b" stroke-width="2.5"/>
    <path d="M140 76 C132 52, 104 52, 102 74 C116 84, 136 86, 146 78 Z" fill="url(#manePink)" stroke="#1e1b4b" stroke-width="2.5"/>

    <!-- SPIRALED GOLDEN HORN -->
    <g>
      <path d="M98 92 L66 28 L120 78 C114 88, 106 92, 98 92 Z" fill="url(#hornGrad)" stroke="#713f12" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M76 46 C86 46, 94 52, 98 60" stroke="#713f12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M84 64 C96 62, 106 68, 112 76" stroke="#713f12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M92 80 C102 78, 112 82, 116 86" stroke="#713f12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CUTE EAR -->
    <path d="M134 92 C132 68, 152 56, 160 72 C166 86, 154 104, 140 102 Z" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="2.6"/>
    <path d="M140 94 C139 76, 151 68, 155 78 C158 86, 150 96, 142 96 Z" fill="url(#manePink)"/>
  </g>
</svg>
