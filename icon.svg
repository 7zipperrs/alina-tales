<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="95" cy="110" r="4" fill="#fef08a" opacity="0.9"/>
  <circle cx="420" cy="95" r="5" fill="#bae6fd" opacity="0.8"/>
  <circle cx="390" cy="210" r="3.5" fill="#fef08a" opacity="0.7"/>
  <circle cx="110" cy="250" r="3" fill="#e9d5ff" opacity="0.8"/>
  <circle cx="160" cy="75" r="2.5" fill="#fff" opacity="0.6"/>
  <!-- Sparkle Star Center Top -->
  <path d="M256 64 L266 98 L300 108 L266 118 L256 152 L246 118 L212 108 L246 98 Z" fill="#fef08a" filter="url(#glow)"/>
  <!-- Crescent Moon -->
  <path d="M330 120 A75 75 0 1 0 410 225 A62 62 0 1 1 330 120 Z" fill="url(#moon)" filter="url(#glow)"/>
  <!-- Magical Open Book -->
  <g transform="translate(0, 20)" filter="url(#glow)">
    <path d="M96 360 C150 330, 210 340, 256 370 C302 340, 362 330, 416 360 L416 250 C362 220, 302 230, 256 260 C210 230, 150 220, 96 250 Z" fill="url(#book)"/>
    <path d="M96 376 C150 346, 210 356, 256 386 C302 356, 362 346, 416 376" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="256" y1="260" x2="256" y2="375" stroke="#312e81" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Crown / Tiara above book -->
  <path d="M196 225 L216 175 L256 205 L296 175 L316 225 Z" fill="#f472b6" stroke="#fef08a" stroke-width="5" stroke-linejoin="round"/>
</svg>
